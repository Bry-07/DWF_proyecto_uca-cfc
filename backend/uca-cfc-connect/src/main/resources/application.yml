spring:
  application:
    name: uca-cfc-connect
  mail:
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  profiles:
    default: dev

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/uca_cfc_connect}
    username: ${DATABASE_USERNAME:cfc_app}
    password: ${DATABASE_PASSWORD:cfc_app_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: cfc-pool
      maximum-pool-size: 10

  jpa:
    # El esquema lo administra Flyway; Hibernate solo lo valida contra las entidades.
    # No se configura hibernate.jdbc.time_zone: las fechas del dominio son
    # LocalDate/LocalDateTime sobre columnas sin zona horaria y deben guardarse
    # y leerse tal cual, sin conversión.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    # Las fechas se serializan en ISO-8601 (2026-09-15T17:00:00), que es el
    # comportamiento por omisión de Jackson 3
    default-property-inclusion: non_null

  web:
    resources:
      add-mappings: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true

app:
  seguridad:
    mostrar-token-recuperacion: false
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  correo:
    remitente: ${SMTP_FROM:no-reply@cfc.uca.edu.sv}
  zona-horaria: America/El_Salvador

  jwt:
    # En producción debe proporcionarse mediante JWT_SECRET.
    secret: ${JWT_SECRET}
    access-minutos: ${JWT_ACCESS_MINUTOS:15}
    refresh-dias: ${JWT_REFRESH_DIAS:7}

  cors:
    origenes: ${CORS_ORIGENES:http://localhost:3000,http://localhost:4200,http://localhost:5173}

logging:
  level:
    com.uca.cfc: INFO
