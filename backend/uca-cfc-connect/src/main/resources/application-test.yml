# Perfil de pruebas: base separada; Flyway también carga la semilla de demostración.
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/uca_cfc_connect_test}
    username: ${DATABASE_USERNAME:cfc_app}
    password: ${DATABASE_PASSWORD:cfc_app_dev}

  flyway:
    # Mismo esquema y migraciones que la aplicación; las pruebas añaden sus propios casos.
    locations: classpath:db/migration
    clean-disabled: false

logging:
  level:
    com.uca.cfc: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:clave-solo-para-pruebas-uca-cfc-connect-2026}
    access-minutos: ${JWT_ACCESS_MINUTOS:15}
    refresh-dias: ${JWT_REFRESH_DIAS:7}
  cors:
    origenes: ${CORS_ORIGENES:http://localhost:3000}
