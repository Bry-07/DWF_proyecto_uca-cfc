# Perfil de desarrollo: más detalle en el log y SQL visible
spring:
  jpa:
    show-sql: true

logging:
  level:
    com.uca.cfc: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: INFO

app:
  jwt:
    secret: ${JWT_SECRET:clave-solo-para-desarrollo-cambiar-en-produccion-2026}
    access-minutos: ${JWT_ACCESS_MINUTOS:15}
    refresh-dias: ${JWT_REFRESH_DIAS:7}
  cors:
    origenes: ${CORS_ORIGENES:http://localhost:3000,http://localhost:4200,http://localhost:5173}
