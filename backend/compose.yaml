# Base de datos PostgreSQL para desarrollo local: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: uca-cfc-postgres
    environment:
      POSTGRES_DB: uca_cfc_connect
      POSTGRES_USER: cfc_app
      POSTGRES_PASSWORD: cfc_app_dev
    ports:
      - "5432:5432"
    volumes:
      - cfc-pgdata:/var/lib/postgresql/data

volumes:
  cfc-pgdata:
